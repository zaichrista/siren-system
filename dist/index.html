<!doctype html>
<html lang="en" data-theme="blush">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ebcdd3">
<meta name="description" content="The Siren System: a calm daily routine for your skin, strength, mind and spirit.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Siren">
<title>The Siren System</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="fonts.css">
<style>
/* Critical: the loading screen paints before anything else */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;align-content:center;gap:10px;background:radial-gradient(circle at 50% 38%,#fbf3f0,#ebcdd3 78%);color:#4d2a3a;text-align:center;transition:opacity .6s ease,visibility .6s}
#splash.done{opacity:0;visibility:hidden}
#splash svg{animation:breathe 5s ease-in-out 1.6s infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#splash svg{width:148px;height:148px;overflow:visible}
#splash .s-name{margin:6px 0 0;font:600 30px/1.1 'Cormorant Garamond',Georgia,serif;letter-spacing:.04em}
#splash .s-tag{margin:0;font:500 13px 'Jost',system-ui,sans-serif;letter-spacing:.28em;text-transform:uppercase;opacity:.7}
#splash .s-bar{width:120px;height:2px;margin-top:18px;background:rgba(77,42,58,.15);border-radius:2px;overflow:hidden}
#splash .s-bar i{display:block;height:100%;width:40%;background:#a8803f;border-radius:2px;animation:sbar 1.2s ease-in-out infinite}
#splash .pt{opacity:0;transform-origin:60px 60px;animation:sbloom .8s calc(.15s + var(--i)*.14s) cubic-bezier(.3,1.4,.5,1) forwards}
#splash .eye{opacity:0;transform-origin:60px 60px;animation:sbloom .6s .95s ease forwards}
#splash .s-name,#splash .s-tag{opacity:0;animation:sfade .8s .9s forwards}
@keyframes sfade{to{opacity:1}}
@keyframes sbloom{0%{opacity:0;transform:scale(.1)}100%{opacity:1;transform:scale(1)}}
@keyframes sbar{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
@media(prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="splash" role="status" aria-label="Loading The Siren System">
  <svg viewBox="0 0 120 120" aria-hidden="true"><g transform="rotate(0 60 60)"><ellipse class="pt" style="--i:0" cx="60" cy="32" rx="9.5" ry="15" fill="none" stroke="#a94f73" stroke-width="3.2"/></g><g transform="rotate(72 60 60)"><ellipse class="pt" style="--i:1" cx="60" cy="32" rx="9.5" ry="15" fill="none" stroke="#a94f73" stroke-width="3.2"/></g><g transform="rotate(144 60 60)"><ellipse class="pt" style="--i:2" cx="60" cy="32" rx="9.5" ry="15" fill="none" stroke="#a94f73" stroke-width="3.2"/></g><g transform="rotate(216 60 60)"><ellipse class="pt" style="--i:3" cx="60" cy="32" rx="9.5" ry="15" fill="none" stroke="#a94f73" stroke-width="3.2"/></g><g transform="rotate(288 60 60)"><ellipse class="pt" style="--i:4" cx="60" cy="32" rx="9.5" ry="15" fill="none" stroke="#a94f73" stroke-width="3.2"/></g><circle class="eye" cx="60" cy="60" r="4.5" fill="#a94f73"/></svg>
  <p class="s-name">The Siren System</p>
  <p class="s-tag">become, gently</p>
  <div class="s-bar"><i></i></div>
</div>

<noscript><p style="padding:24px;font:16px system-ui">The Siren System needs JavaScript to run. Please enable it and reload.</p></noscript>

<a class="skip-link" href="#main">Skip to content</a>

<nav class="tabbar" aria-label="Quick navigation">

</html>
